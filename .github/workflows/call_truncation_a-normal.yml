# CALLER C / case a-normal - object-key control by URL truncation.
#
# Calls OUR OWN replica of google-gh-automation/workflows
# .github/workflows/github_actions_scan.yml @ 22b63c643fbe7b395b00cc3952ab552decc586c7,
# in its live-curl variant, whose curl points at a listener bound to 127.0.0.1 on the
# runner. It never calls Google's reusable workflow and never reaches any Google endpoint.
#
# Case A, the baseline: an ordinary bucket name. The workflow appends its own suffix.
#
# Neither bucket value below is, or resembles, a Google bucket name.

name: 'Caller C a-normal - truncation'

on:
  pull_request:

permissions: {}

jobs:
  scan:
    permissions:
      contents: 'read'
      id-token: 'write'
    uses: ooriime/oss-vrp-replica-workflows/.github/workflows/github_actions_scan_live_curl.yml@main
    with:
      wif_provider: 'projects/000000000000/locations/global/workloadIdentityPools/replica-fake-pool/providers/replica-fake-provider'
      zizmor_config_bucket: 'replica-fake-configs-cc63'
      zizmor_result_bucket: 'replica-fake-results-7165'
      zizmor_enforce: 'false'
